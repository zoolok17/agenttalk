[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenttalk"
version = "0.72.2"
description = "File-backed message bus and coordination layer for coding-agent CLIs (Claude Code and Codex) - a pair or a named team - working on the same repository."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "agenttalk contributors" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]
security = [
    "ruff>=0.6",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[tool.ruff]
# 120 is generous-but-not-permissive; lets multi-line user-facing
# error strings stay one line each without sacrificing readability.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Keep the lint surface tight: errors, syntax, comprehensions,
# bugbear, security (S). Tune as warnings show up.
select = ["E", "F", "B", "S", "C4"]
ignore = [
    "S101",  # assert in tests — pytest convention
    "S603",  # subprocess without shell=False — we never use subprocess
    "S607",  # partial-path subprocess calls — same
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # asserts are the point in tests
    "S105",  # hardcoded "test passwords" used as message bodies
    "S106",
]
# The supervisor module embeds generated PowerShell/bash script templates as
# string literals; those shell one-liners legitimately exceed the Python line
# length. The Python logic in the file still respects it.
"src/agenttalk/supervisor.py" = ["E501"]

[project.scripts]
agenttalk = "agenttalk.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/.gitattributes",
    "/.gitignore",
    "/.gitleaks.toml",
    "/.gitleaksignore",
    "/.semgrep",
    "/CHANGELOG.md",
    "/README.md",
    "/ROADMAP.md",
    "/SECURITY.md",
    "/docs/AGENT-MANUAL.md",
    "/docs/AGENTTALK-NEW-USER-MANUAL.md",
    "/docs/AGENTTALK-NEW-USER-MANUAL.pdf",
    "/docs/ASSURANCE.md",
    "/docs/DASHBOARD-CONTROL-PLANE-ROADMAP.md",
    "/docs/DESIGN.md",
    "/docs/DashboardDesign",
    "/docs/ISSUES.md",
    "/docs/ROADMAP.md",
    "/docs/USER-MANUAL.md",
    "/docs/agenttalk-delivery-os-field-notes.md",
    "/docs/audit-2026-06-28.md",
    "/docs/reviews",
    "/docs/rfc-identity-authz.md",
    "/docs/skill-devkit-evolution-design.md",
    "/docs/supervisor-hosting.md",
    "/docs/supervisor-liveness-design.md",
    "/docs/supervisor-tutorial.md",
    "/kitty-specs",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agenttalk"]
# The Team Console's served static assets (web_static/console.css + console.js)
# ship as package data automatically: they live under the packaged src/agenttalk
# dir, and hatchling includes non-.py package files by default. Do NOT add a
# `force-include` for them — the package dir already carries them, so a
# force-include double-adds the same path and the wheel build fails with
# "A second file is being added to the wheel archive at the same path" (v0.58.0-0.58.2).
