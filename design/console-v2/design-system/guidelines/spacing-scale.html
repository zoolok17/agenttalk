<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="Compact 2px-derived rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--canvas);padding:18px}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .k{font-family:var(--font-mono);font-size:10px;color:var(--ink-4);width:120px;flex:none}
  .bar{height:14px;background:var(--accent-soft);border-left:2px solid var(--accent);border-radius:3px}
</style></head>
<body>
  <div class="row"><span class="k">--space-3 · 8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="k">--space-5 · 12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="k">--space-7 · 16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="k">--space-9 · 20</span><div class="bar" style="width:20px"></div></div>
  <div class="row"><span class="k">--space-10 · 24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="k">--space-12 · 30</span><div class="bar" style="width:30px"></div></div>
</body></html>
