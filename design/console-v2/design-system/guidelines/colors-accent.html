<!-- @dsCard group="Colors" viewport="700x150" name="Accent & theme" subtitle="Themeable indigo + soft tint, light/dark" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--canvas);padding:16px;display:flex;gap:22px}
  .pane{flex:1;border-radius:var(--radius-card);border:1px solid var(--border);overflow:hidden}
  .row{display:flex}
  .sw{flex:1;height:60px;display:flex;align-items:flex-end;padding:6px 8px;font-family:var(--font-mono);font-size:10px;color:#fff}
  .meta{padding:8px 10px;font-size:11px;color:var(--ink-3);background:var(--surface);border-top:1px solid var(--hairline)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-4);padding:0 0 6px}
</style></head>
<body>
  <div>
    <div class="lbl">LIGHT</div>
    <div class="pane">
      <div class="row">
        <div class="sw" style="background:var(--accent)">--accent</div>
        <div class="sw" style="background:var(--accent-soft);color:var(--accent)">--accent-soft</div>
      </div>
      <div class="meta">#4457E6 · used for primary actions, active nav, live highlights</div>
    </div>
  </div>
  <div data-theme="dark">
    <div class="lbl">DARK</div>
    <div class="pane" style="background:var(--surface)">
      <div class="row">
        <div class="sw" style="background:var(--accent)">--accent</div>
        <div class="sw" style="background:var(--accent-soft);color:var(--accent)">--accent-soft</div>
      </div>
      <div class="meta">#8091FF · brightened for contrast on graphite</div>
    </div>
  </div>
</body></html>
