<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals — dark" subtitle="Graphite surfaces and ink ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);padding:16px}
  .grp{display:flex;gap:6px;margin-bottom:10px}
  .sw{flex:1;height:44px;border-radius:8px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:5px 6px;font-family:var(--font-mono);font-size:9px;color:var(--ink-3)}
  .ink{flex:1;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:#0E1116}
</style></head>
<body data-theme="dark" style="background:var(--canvas)">
  <div class="grp">
    <div class="sw" style="background:var(--canvas)">canvas</div>
    <div class="sw" style="background:var(--surface)">surface</div>
    <div class="sw" style="background:var(--surface-2)">surface-2</div>
    <div class="sw" style="background:var(--border)">border</div>
    <div class="sw" style="background:var(--track)">track</div>
    <div class="sw" style="background:var(--edge)">edge</div>
  </div>
  <div class="grp">
    <div class="ink" style="background:var(--ink)">ink</div>
    <div class="ink" style="background:var(--ink-2)">ink-2</div>
    <div class="ink" style="background:var(--ink-3)">ink-3</div>
    <div class="ink" style="background:var(--ink-4)">ink-4</div>
    <div class="ink" style="background:var(--ink-5)">ink-5</div>
  </div>
</body></html>
