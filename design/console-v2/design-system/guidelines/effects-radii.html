<!-- @dsCard group="Brand" viewport="700x160" name="Radii & shadow" subtitle="Cards, buttons, chips, status spine" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--canvas);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .box{background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);width:96px;height:64px;text-align:center;padding:6px}
  .spine{box-shadow:inset 3px 0 0 var(--ok), var(--shadow-card)}
</style></head>
<body>
  <div class="box" style="border-radius:var(--radius-chip)">chip 6</div>
  <div class="box" style="border-radius:var(--radius-btn)">btn 8</div>
  <div class="box" style="border-radius:var(--radius-input)">input 10</div>
  <div class="box" style="border-radius:var(--radius-card);box-shadow:var(--shadow-card)">card 12<br>shadow-card</div>
  <div class="box" style="border-radius:var(--radius-card);box-shadow:var(--shadow-hover)">card 12<br>hover</div>
  <div class="box spine" style="border-radius:var(--radius-card)">status spine</div>
</body></html>
