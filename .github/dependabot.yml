version: 2

# Keep GitHub Actions SHAs current. We hash-pin third-party actions
# in `.github/workflows/*.yml` (per zizmor `unpinned-uses` /
# OWASP CI/CD recommendations) but pinning by SHA means we'd miss
# upstream security fixes without automation. Dependabot bumps the
# SHA and keeps the trailing `# vX` comment in sync, so the
# auto-PR is human-readable and the policy stays satisfied.
updates:

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # We keep one narrow runtime dependency plus small `[dev]` / `[security]`
  # extras. Dependabot surfaces security updates for the runtime package and
  # for contributors using `pip install -e ".[dev]"`.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
