name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Keep dependency/security checks current when the repository is quiet.
    - cron: '17 9 * * 1'
  workflow_dispatch:

# One in-flight run per workflow+ref. A later push to a topic branch supersedes
# the earlier one, which is otherwise pure waste: without this, every push
# queued an ADDITIONAL full 13-job matrix and superseded runs kept holding
# runner slots (measured 2026-07-30: 6 queued / 2 running, ~half superseded,
# a master commit stuck queued 35+ minutes while its security run finished).
# master is deliberately EXEMPT from cancellation - a release-gating or
# version-ratchet run must never be killed by a following push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  dev-gate-leg:
    name: dev-gate (${{ matrix.os.id }}/${{ matrix.python-version }})
    runs-on: ${{ matrix.os.runner }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
      # C-1a (reviewer-3, PR-B delta review round 2): tests/conftest.py's
      # Windows-symlink-devmode fixture requires this dedicated,
      # repo-specific opt-in IN ADDITION to the CI/GITHUB_ACTIONS platform
      # variables (which a local Actions emulator can also set) before it
      # will mutate this runner's registry - set explicitly only here, the
      # one job whose Windows leg needs those symlink tests to execute.
      AGENTTALK_AUTHORIZE_SYMLINK_DEVMODE: ${{ matrix.os.id == 'windows' && '1' || '' }}
      # ci-xdist-posix (see #232's probe for why): two pytest-xdist workers
      # on Linux/macOS only - set here, by the OS-scoped matrix expression,
      # never by a runtime platform check inside dev_gate.py (whose only
      # per-OS value is the pytest time limit that dev-gate.json declares).
      # Windows stays serial: PowerShell-host
      # startup capacity and a fixed-port gateway test both showed real
      # contention under parallel workers there that #232's probe did not
      # finish running to ground in six rounds.
      AGENTTALK_DEV_GATE_POSIX_PARALLEL: ${{ matrix.os.id != 'windows' && '1' || '' }}
      # #318: the tests that bind or call the gateway's real fixed ports
      # (127.0.0.1:4000/4001) are opt-in, so a developer machine running the
      # live gateway never reaches it; every dev-gate leg opts in, so CI runs
      # them exactly as before (dev_gate.py forwards only the value "1").
      AGENTTALK_TEST_GATEWAY_PORTS: '1'
    # Per-OS ceiling: the two pytest runs (source + wheel) are each capped at
    # 7200s in dev-gate.json (raised from 5400s). Measured 2026-09-29 (the
    # 09-25 "~55-65 min per run" figure above was already stale): PR #230's
    # dev-gate windows/3.11 run (36559648529) had its SOURCE pytest killed at
    # the 5400s cap at 93% complete with no failing test; its wheel run took
    # 5085s (94% of that cap); the job used 177 of its 180 min ceiling.
    # Windows legs generally now take 125-177 min. So the Windows job ceiling
    # is 270 min: two pytest runs each capped at 7200s (120 min) plus roughly
    # 30 min for setup and the other per-leg checks, within GitHub's 360-min
    # job maximum. The Windows runner's slow filesystem + costly process/venv
    # creation push its wall time up to that ceiling, leaving no headroom for
    # setup and the other per-leg checks — the leg is then killed by
    # duration, not by a test failure. Windows gets a wider ceiling; the fast
    # Linux/macOS legs keep a tight cap so a genuine hang there still fails
    # quickly. This is a stopgap (following the #197 precedent, 87c529a) -
    # the real fix follows a per-test duration measurement.
    #
    # #378, TEMPORARY, expires 2026-11-06: Windows pytest runs again reached
    # their 7200s limit (2026-10-06, PR #372 run 37438299560, windows/3.12: the
    # source run was killed at 90% with no failure, the wheel run passed 15s
    # under the limit; the leg took 4h02). dev-gate.json now gives Windows
    # pytest runs 9000s (windows_timeout_seconds; Linux/macOS stay at 7200s),
    # so the Windows job ceiling is 330 min: two pytest runs capped at 150 min
    # each plus about 30 min for setup and the other checks, under GitHub's
    # 360-min job maximum. Every pytest run now also logs per-test durations
    # (--durations=0), the measurement for splitting the Windows jobs. By
    # 2026-11-06, use those timings to split or speed up the Windows runs and
    # remove this margin, or record why it stays.
    timeout-minutes: ${{ matrix.os.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: linux
            runner: ubuntu-latest
            timeout_minutes: 90
          - id: windows
            runner: windows-latest
            timeout_minutes: 330  # #378 temporary margin, expires 2026-11-06 (see above)
          - id: macos
            runner: macos-latest
            timeout_minutes: 90
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install gate dependencies
        run: |
          python -I -m pip install --upgrade pip
          python -I -m pip install -r dev-gate-requirements.txt
          python -I -m pip install --no-deps --no-build-isolation .
      - name: Install pinned gitleaks on the manifest's canonical static leg
        if: matrix.os.id == 'linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bindir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check -
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" gitleaks
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Run the committed gate
        run: >
          python -I -m agenttalk dev-gate
          --profile release
          --ci-leg "${{ matrix.os.id }}/${{ matrix.python-version }}"
          --evidence "${{ runner.temp }}/dev-gate-evidence/dev-gate-evidence.json"
      - name: Upload leg evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dev-gate-leg-${{ matrix.os.id }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/dev-gate-evidence/
          if-no-files-found: error
          retention-days: 14

  dev-gate-aggregate:
    name: dev-gate aggregate
    needs: dev-gate-leg
    if: always()
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install aggregate command
        run: |
          python -I -m pip install -r dev-gate-requirements.txt
          python -I -m pip install --no-deps --no-build-isolation .
      - name: Download leg evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: dev-gate-leg-*
          path: ${{ runner.temp }}/dev-gate-legs
          merge-multiple: false
      - name: Aggregate the exact declared matrix
        if: always()
        run: >
          python -I -m agenttalk dev-gate
          --profile release
          --aggregate "${{ runner.temp }}/dev-gate-legs"
          --evidence "${{ runner.temp }}/dev-gate-aggregate.json"
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dev-gate-aggregate
          path: ${{ runner.temp }}/dev-gate-aggregate.json
          if-no-files-found: error
          retention-days: 14
