name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Keep dependency/security checks current when the repository is quiet.
    - cron: '17 9 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact post-bump commit to gate; empty only for the ordinary CI triggers.
        required: true
        type: string
      release_version:
        description: Stable X.Y.Z version bound to the release-candidate evidence.
        required: true
        type: string
      artifact_prefix:
        description: Run-attempt-specific namespace for release-candidate artifacts.
        required: true
        type: string
      preflight_at:
        description: UTC timestamp emitted by the release-candidate preflight.
        required: true
        type: string

# One in-flight run per workflow+ref. A later push to a topic branch supersedes
# the earlier one, which is otherwise pure waste: without this, every push
# queued an ADDITIONAL full 13-job matrix and superseded runs kept holding
# runner slots (measured 2026-07-30: 6 queued / 2 running, ~half superseded,
# a master commit stuck queued 35+ minutes while its security run finished).
# master is deliberately EXEMPT from cancellation - a release-gating or
# version-ratchet run must never be killed by a following push.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  EVIDENCE_ARTIFACT_PREFIX: ${{ inputs.artifact_prefix || 'dev-gate' }}

jobs:
  dev-gate-leg:
    name: dev-gate (${{ matrix.os.id }}/${{ matrix.python-version }})
    runs-on: ${{ matrix.os.runner }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
    # Per-OS ceiling: the two pytest runs (source + wheel) are each capped at
    # 2700s in dev-gate.json, so a single leg's pytest budget alone is 90 min.
    # The Windows runner's slow filesystem + costly process/venv creation push
    # its wall time up to that ceiling, leaving no headroom for setup and the
    # other per-leg checks — the leg is then killed by duration, not by a test
    # failure. Windows gets a wider ceiling; the fast Linux/macOS legs keep a
    # tight cap so a genuine hang there still fails quickly.
    timeout-minutes: ${{ matrix.os.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: linux
            runner: ubuntu-latest
            timeout_minutes: 90
          - id: windows
            runner: windows-latest
            timeout_minutes: 120
          - id: macos
            runner: macos-latest
            timeout_minutes: 90
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install gate dependencies
        run: |
          python -I -m pip install --upgrade pip
          python -I -m pip install -r dev-gate-requirements.txt
          python -I -m pip install --no-deps --no-build-isolation .
      - name: Install pinned gitleaks on the manifest's canonical static leg
        if: matrix.os.id == 'linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bindir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check -
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" gitleaks
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Run the committed gate
        run: >
          python -I -m agenttalk dev-gate
          --profile release
          --ci-leg "${{ matrix.os.id }}/${{ matrix.python-version }}"
          --temp-root "${{ runner.temp }}/dev-gate-run"
          --evidence "${{ runner.temp }}/dev-gate-evidence.json"
      - name: Retain the canonical gate-built packages
        if: inputs.candidate_sha != '' && matrix.os.id == 'linux' && matrix.python-version == '3.12' && success()
        shell: bash
        env:
          RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: >
          python -I .github/scripts/prepare_release_provenance.py export
          --repo-root "$GITHUB_WORKSPACE"
          --raw-evidence "$RUNNER_TEMP/dev-gate-evidence.json"
          --runner-temp "$RUNNER_TEMP"
          --output "$RUNNER_TEMP/release-candidate-packages"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --version "$RELEASE_VERSION"
      - name: Upload the canonical gate-built packages
        if: inputs.candidate_sha != '' && matrix.os.id == 'linux' && matrix.python-version == '3.12' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.EVIDENCE_ARTIFACT_PREFIX }}-packages
          path: ${{ runner.temp }}/release-candidate-packages
          if-no-files-found: error
          retention-days: 14
      - name: Upload leg evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.EVIDENCE_ARTIFACT_PREFIX }}-leg-${{ matrix.os.id }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/dev-gate-evidence.json
          if-no-files-found: error
          retention-days: 14

  dev-gate-aggregate:
    name: dev-gate aggregate
    needs: dev-gate-leg
    if: always()
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install aggregate command
        run: |
          python -I -m pip install -r dev-gate-requirements.txt
          python -I -m pip install --no-deps --no-build-isolation .
      - name: Download leg evidence
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: ${{ env.EVIDENCE_ARTIFACT_PREFIX }}-leg-*
          path: ${{ runner.temp }}/dev-gate-legs
          merge-multiple: false
      - name: Aggregate the exact declared matrix
        if: always()
        run: >
          python -I -m agenttalk dev-gate
          --profile release
          --aggregate "${{ runner.temp }}/dev-gate-legs"
          --evidence "${{ runner.temp }}/dev-gate-aggregate.json"
      - name: Bind the aggregate to this release-candidate run attempt
        if: inputs.candidate_sha != '' && success()
        shell: bash
        env:
          RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_PREFLIGHT_AT: ${{ inputs.preflight_at }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: >
          python -I .github/scripts/prepare_release_provenance.py gate-receipt
          --repo-root "$GITHUB_WORKSPACE"
          --aggregate "$RUNNER_TEMP/dev-gate-aggregate.json"
          --output "$RUNNER_TEMP/release-gate-receipt.json"
          --candidate-sha "$RELEASE_CANDIDATE_SHA"
          --version "$RELEASE_VERSION"
          --artifact-prefix "$EVIDENCE_ARTIFACT_PREFIX"
          --repository "$GITHUB_REPOSITORY"
          --workflow-ref "$RELEASE_WORKFLOW_REF"
          --workflow-sha "$RELEASE_WORKFLOW_SHA"
          --actor "$GITHUB_ACTOR"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --preflight-at "$RELEASE_PREFLIGHT_AT"
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.EVIDENCE_ARTIFACT_PREFIX }}-aggregate
          path: |
            ${{ runner.temp }}/dev-gate-aggregate.json
            ${{ runner.temp }}/release-gate-receipt.json
          if-no-files-found: error
          retention-days: 14
