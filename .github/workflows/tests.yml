name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Keep dependency/security checks current when the repository is quiet.
    - cron: '17 9 * * 1'
    # The Windows mode trial (8 long Windows legs, not a release gate) runs from
    # this one only, and from a manual run on master. See the trial job below.
    # 02:23 UTC: the quietest hour for pull requests, off the :00 mark that
    # scheduled runs crowd, and the trial is done before the working day starts.
    - cron: '23 2 * * *'
  workflow_dispatch:

# One in-flight run per workflow+ref. A later push to a topic branch supersedes
# the earlier one, which is otherwise pure waste: without this, every push
# queued an ADDITIONAL full 13-job matrix and superseded runs kept holding
# runner slots (measured 2026-07-30: 6 queued / 2 running, ~half superseded,
# a master commit stuck queued 35+ minutes while its security run finished).
# master is deliberately EXEMPT from cancellation - a release-gating or
# version-ratchet run must never be killed by a following push.
#
# The daily trial run and a manual run on master have a group of their own
# ("trial-" put in front of the ref). A run that waits behind a running master
# run is replaced by the next run in its group (GitHub keeps only the newest
# waiting run), and a push has no trial jobs: in one group, a push arriving
# behind the waiting daily run would replace it and the day's measurement would
# be lost. Their comparison legs stay in the same run. The marker goes before
# the ref because every other group is "<workflow>-" plus a ref, and a ref always
# starts with "refs/": no branch name can make a group that starts
# "<workflow>-trial-". A master run that is already running is not cancelled by a
# later run; a waiting run can still be replaced by a newer waiting run of its
# own group. The weekly run starts no trial, so it stays in the push group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '23 2 * * *')) && 'trial-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  scope:
    name: Choose PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Classify all changed paths
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && git cat-file -e "$BASE_SHA:scripts/ci_scope.py"; then
            git show "$BASE_SHA:scripts/ci_scope.py" > "$RUNNER_TEMP/ci_scope.py"
            python "$RUNNER_TEMP/ci_scope.py" >> "$GITHUB_OUTPUT"
          else
            # Includes the first rollout, before master has a classifier.
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  docs-checks:
    name: Documentation checks
    needs: scope
    if: needs.scope.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install documentation check tools
        run: python -I -m pip install 'pytest>=8.0' 'zizmor>=1.28.0'
      - name: Check documentation wording and gate reference
        run: |
          python -m pytest -q tests/test_docs_plain_voice.py --basetemp "$RUNNER_TEMP/docs-voice"
          python -m pytest -q tests/test_dev_gate_docs.py --basetemp "$RUNNER_TEMP/docs-gate"
      - name: Install pinned gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bindir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 --retry-max-time 120 --connect-timeout 10 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check -
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" gitleaks
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Scan full history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --log-opts=--all .
      - name: Check workflow security
        run: zizmor .github/workflows

  dev-gate-leg:
    name: dev-gate (${{ matrix.os.id }}/${{ matrix.python-version }})
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ${{ matrix.os.runner }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
      # C-1a (reviewer-3, PR-B delta review round 2): tests/conftest.py's
      # Windows-symlink-devmode fixture requires this dedicated,
      # repo-specific opt-in IN ADDITION to the CI/GITHUB_ACTIONS platform
      # variables (which a local Actions emulator can also set) before it
      # will mutate this runner's registry - set explicitly only here, the
      # one job whose Windows leg needs those symlink tests to execute.
      AGENTTALK_AUTHORIZE_SYMLINK_DEVMODE: ${{ matrix.os.id == 'windows' && '1' || '' }}
      # ci-xdist-posix (see #232's probe for why): two pytest-xdist workers
      # on Linux/macOS only - set here, by the OS-scoped matrix expression,
      # never by a runtime platform check inside dev_gate.py.
      # dev-gate.json declares Windows group selection and per-OS time limits.
      # Windows stays serial: PowerShell-host
      # startup capacity and a fixed-port gateway test both showed real
      # contention under parallel workers there that #232's probe did not
      # finish running to ground in six rounds.
      AGENTTALK_DEV_GATE_POSIX_PARALLEL: ${{ matrix.os.id != 'windows' && '1' || '' }}
      # #318: the tests that bind or call the gateway's real fixed ports
      # (127.0.0.1:4000/4001) are opt-in, so a developer machine running the
      # live gateway never reaches it; every dev-gate leg opts in, so CI runs
      # them exactly as before (dev_gate.py forwards only the value "1").
      AGENTTALK_TEST_GATEWAY_PORTS: '1'
      # #675: every leg installs build and hatchling from dev-gate-requirements.txt,
      # so tests/test_lead_docs.py's wheel check must run in source mode, not skip
      # (dev_gate.py forwards only the value "1").
      AGENTTALK_TEST_BUILD_TOOLS: '1'
    # #378 layout 3a: four Windows runners, each runs source A, source B,
    # wheel A and wheel B. Each group retains the 9000s run limit.
    # Two hosted runs gave the margins recorded in windows_timeout_reason in
    # dev-gate.json, and the 330-minute job ceiling was retained; changing it
    # needs new evidence. Grouping shortens each run, not the whole job.
    # Linux/macOS keep one run per mode and the 90-minute job ceiling.
    timeout-minutes: ${{ matrix.os.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - id: linux
            runner: ubuntu-latest
            timeout_minutes: 90
          - id: windows
            runner: windows-latest
            timeout_minutes: 330  # #378 layout 3a; retained after two hosted runs (see above)
          - id: macos
            runner: macos-latest
            timeout_minutes: 90
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install gate dependencies
        run: |
          python -I -m pip install --upgrade pip
          python -I -m pip install -r dev-gate-requirements.txt
          python -I -m pip install --no-deps --no-build-isolation .
      - name: Install pinned gitleaks on the manifest's canonical static leg
        if: matrix.os.id == 'linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          bindir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --silent --show-error \
            --retry 3 --retry-delay 5 --retry-max-time 120 --connect-timeout 10 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check -
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" gitleaks
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Run the committed gate
        run: >
          python -I -m agenttalk dev-gate
          --profile release
          --ci-leg "${{ matrix.os.id }}/${{ matrix.python-version }}"
          --evidence "${{ runner.temp }}/dev-gate-evidence/dev-gate-evidence.json"
      - name: Upload leg evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dev-gate-leg-${{ matrix.os.id }}-${{ matrix.python-version }}
          path: ${{ runner.temp }}/dev-gate-evidence/
          if-no-files-found: error
          retention-days: 14

  dev-gate-aggregate:
    name: dev-gate aggregate
    needs: [scope, docs-checks, dev-gate-leg]
    if: always()
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      PYTHONDONTWRITEBYTECODE: '1'
    timeout-minutes: 20
    steps:
      - name: Require the selected checks to succeed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          DOCS_RESULT: ${{ needs.docs-checks.result }}
          LEG_RESULT: ${{ needs.dev-gate-leg.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$DOCS_ONLY" = true ]; then
            test "$DOCS_RESULT" = success
            echo 'Documentation checks passed; full release gate not run.' >> "$GITHUB_STEP_SUMMARY"
          else
            test "$DOCS_ONLY" = false
            test "$LEG_RESULT" = success
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: always() && needs.scope.outputs.docs_only == 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: always() && needs.scope.outputs.docs_only == 'false'
        with:
          python-version: '3.12'
      - name: Install aggregate command
        if: always() && needs.scope.outputs.docs_only == 'false'
        run: |
          python -I -m pip install -r dev-gate-requirements.txt
          python -I -m pip install --no-deps --no-build-isolation .
      - name: Download leg evidence
        if: always() && needs.scope.outputs.docs_only == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dev-gate-leg-*
          path: ${{ runner.temp }}/dev-gate-legs
          merge-multiple: false
      - name: Aggregate the exact declared matrix
        if: always() && needs.scope.outputs.docs_only == 'false'
        run: >
          python -I -m agenttalk dev-gate
          --profile release
          --aggregate "${{ runner.temp }}/dev-gate-legs"
          --evidence "${{ runner.temp }}/dev-gate-aggregate.json"
      - name: Upload aggregate evidence
        if: always() && needs.scope.outputs.docs_only == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dev-gate-aggregate
          path: ${{ runner.temp }}/dev-gate-aggregate.json
          if-no-files-found: error
          retention-days: 14

      - name: Report Windows group times
        if: always() && needs.scope.outputs.docs_only == 'false'
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/dev-gate-aggregate.json
        run: |
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path
          try:
              evidence = json.loads(Path(os.environ["EVIDENCE_PATH"]).read_text())
          except FileNotFoundError:
              evidence = {"legs": []}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              if not Path(os.environ["EVIDENCE_PATH"]).is_file():
                  summary.write("\nThe aggregate evidence file is missing; see the aggregate step failure.\n")
              summary.write("\n| Windows leg | Mode check | Group | Seconds |\n| --- | --- | --- | ---: |\n")
              for leg in evidence.get("legs", []):
                  for mode, groups in leg.get("pytest_group_times_ms", {}).items():
                      for group, milliseconds in groups.items():
                          summary.write(f"| {leg['ci_leg']} | {mode} | {group} | {milliseconds / 1000:.3f} |\n")
              summary.write("\n| Windows leg | Collection seconds |\n| --- | ---: |\n")
              for leg in evidence.get("legs", []):
                  if not leg["ci_leg"].startswith("windows/"):
                      continue
                  phases = leg.get("pytest_collection_times_ms", {})
                  values = [value for mode in phases.values() for value in mode.values()]
                  seconds = f"{sum(values) / 1000:.3f}" if len(values) == 6 and all(type(v) is int for v in values) else "unavailable"
                  summary.write(f"| {leg['ci_leg']} | {seconds} |\n")
          PY

  windows-mode-trial:
    name: Windows mode trial (windows/${{ matrix.python-version }}/${{ matrix.mode }})
    # Once a day on master (the daily cron, not the weekly one) and on a manual
    # run on master; no longer on every push, where its 8 legs held 8 of the 20
    # runners and queued pull request legs for hours.
    if: github.ref == 'refs/heads/master' && ((github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    # Non-voting experiment. The two existing jobs above remain authoritative.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
        mode: [source, wheel]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AGENTTALK_AUTHORIZE_SYMLINK_DEVMODE: '1'
      # Same hosted-CI-only coverage opt-in as the existing legs, never set locally.
      AGENTTALK_TEST_GATEWAY_PORTS: '1'
      AGENTTALK_TEST_BUILD_TOOLS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install trial runner
        run: |
          python -I -m pip install --upgrade pip
          python -I -m pip install -r dev-gate-requirements.txt
          python -I -m pip install --no-deps --no-build-isolation .
      - name: Run trial mode
        run: >
          python -I -m agenttalk.dev_gate_trial run
          --leg "windows/${{ matrix.python-version }}" --mode "${{ matrix.mode }}"
          --output "${{ runner.temp }}/windows-trial"
      - name: Upload trial evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-trial-${{ github.run_id }}-${{ github.run_attempt }}-windows-${{ matrix.python-version }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/windows-trial/
          if-no-files-found: error
          retention-days: 14

  windows-trial-aggregate:
    name: Windows mode trial aggregate (not a release gate)
    needs: [windows-mode-trial, dev-gate-leg]
    # Same condition as the trial. The dev-gate legs it compares with run in the
    # same run: scheduled and manual runs are never pull requests, so the scope
    # job gives docs_only=false and every leg runs.
    if: always() && github.ref == 'refs/heads/master' && ((github.event_name == 'schedule' && github.event.schedule == '23 2 * * *') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install trial collector
        run: |
          python -I -m pip install -r dev-gate-requirements.txt
          python -I -m pip install --no-deps --no-build-isolation .
      - name: Verify exact artifacts and record timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python -I -m agenttalk.dev_gate_trial aggregate
          --output "${{ runner.temp }}/windows-trial-collected"
      - name: Upload trial comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: windows-trial-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-trial-collected/
          if-no-files-found: error
          retention-days: 14
